name: Desktop Release

on:
  push:
    branches: [main]
    paths: [Cargo.toml]
  workflow_dispatch:
    inputs:
      mode:
        description: Verify packages without publishing, or retry a main release
        required: true
        type: choice
        default: verify
        options: [verify, publish]

permissions:
  contents: read

# Do not cancel a publication partway through an upload.
concurrency:
  group: desktop-release
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  admission:
    name: Validate release source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.source.outputs.version }}
      commit: ${{ steps.source.outputs.commit }}
      publish: ${{ steps.mode.outputs.publish }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Select explicitly requested mode
        id: mode
        env:
          MODE: ${{ github.event_name == 'push' && 'publish' || inputs.mode }}
        run: |
          if [[ "$MODE" == publish ]]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          elif [[ "$MODE" == verify ]]; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            exit 1
          fi
      - name: Check immutable source, version and merged release PR
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ steps.mode.outputs.publish }}
        run: |
          if [[ "$PUBLISH" == true ]]; then
            python tooling/release.py prepare
          else
            python tooling/release.py inspect
          fi

  build:
    name: Package ${{ matrix.platform }}
    needs: admission
    # Homebrew libmpv, Skia and two Slint builds (tests and release) per runner.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2025
          - platform: macos-arm64
            runner: macos-15
          - platform: macos-x64
            runner: macos-15-intel
          - platform: linux-x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.admission.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install Linux Slint and libmpv build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang libmpv-dev \
            libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-dev libx11-xcb-dev libxcursor-dev libxi-dev \
            libegl1-mesa-dev libgl1-mesa-dev dpkg-dev dbus-daemon gnome-keyring
          pkg-config --modversion mpv
      - name: Install macOS libmpv from Homebrew
        if: runner.os == 'macOS'
        run: |
          brew install mpv pkgconf
          # Preinstalled kegs can predate Homebrew SBOMs, which the source set verifies against.
          for formula in mpv $(brew deps --installed mpv); do
            keg=$(cd "$(brew --prefix "$formula")" && pwd -P)
            [[ -f "$keg/sbom.spdx.json" ]] || brew reinstall "$formula"
          done
          pkg-config --modversion mpv
      - name: Prepare pinned Windows libmpv
        if: runner.os == 'Windows'
        run: |
          mpv_dir=$(python tooling/bundle_slint_release.py windows-mpv target/release-mpv)
          echo "MPV_LIB_DIR=$mpv_dir" >> "$GITHUB_ENV"
          echo "$mpv_dir" >> "$GITHUB_PATH"
      - name: Activate the repository Rust toolchain
        run: |
          rustup show
          rustc --version
      - name: Install pinned Windows installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: tooling/windows/install_inno.ps1
      - name: Test release tooling and documentation
        run: |
          python -m unittest discover -s tooling -p 'test_*.py'
          python tooling/check.py docs
      - name: Test JavaScript
        run: node --test tooling/test_*.mjs
      - name: Verify core
        run: python tooling/check.py core
      - name: Verify Slint compilation and unit tests
        run: |
          cargo clippy --locked --features native-player-probe --all-targets -- -D warnings
          cargo test --locked --features native-player-probe --lib --bin pttstella --test multi_instance
      - name: Verify Windows Credential Manager persistence
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: cargo test --locked --features native-player-probe --lib login::vault::tests::native_roundtrip -- --ignored --exact
      - name: Verify Linux Secret Service persistence and unavailable service
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          vault_tmp=$(mktemp -d "$RUNNER_TEMP/pttstella-vault.XXXXXX")
          trap 'rm -rf -- "$vault_tmp"' EXIT
          export XDG_DATA_HOME="$vault_tmp/data" XDG_CONFIG_HOME="$vault_tmp/config"
          export XDG_CACHE_HOME="$vault_tmp/cache" XDG_RUNTIME_DIR="$vault_tmp/runtime"
          mkdir -m 700 "$XDG_DATA_HOME" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME" "$XDG_RUNTIME_DIR"
          unset GNOME_KEYRING_CONTROL
          dbus-run-session -- bash -euo pipefail -c '
            printf "%s" "synthetic-keyring-password" | gnome-keyring-daemon --unlock --components=secrets
            cargo test --locked --features native-player-probe --lib login::vault::tests::native_roundtrip -- --ignored --exact
          '
          DBUS_SESSION_BUS_ADDRESS=unix:path=/nonexistent-pttstella-synthetic-bus \
            cargo test --locked --features native-player-probe --lib login::vault::tests::native_service_unavailable -- --ignored --exact
      - name: Build and verify native release downloads
        run: python tooling/bundle_release.py --out-dir dist/release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.platform }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish complete Release
    needs: [admission, build]
    if: needs.admission.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.admission.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: dist/release
          merge-multiple: true
      - name: Recheck policy and publish all verified downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tooling/release.py publish --assets dist/release
