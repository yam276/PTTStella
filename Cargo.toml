[package]
name = "pttstella"
version = "0.1.0"
authors = ["yam276"]
repository = "https://github.com/yam276/PTTStella"
edition = "2024"
rust-version = "1.97"
publish = false
default-run = "pttstella"

[features]
default = []
desktop = ["dep:png", "dep:arboard", "dep:dioxus-icons", "dep:dioxus", "dep:tokio", "dep:base64", "dep:tokio-tungstenite", "dep:futures-util", "dep:rustls", "dep:rustls-native-certs", "dep:webbrowser", "dep:rfd", "dep:tempfile", "dep:directories", "dep:reqwest", "dep:imagesize", "dep:security-framework", "dep:font-kit", "dep:winresource"]

[dependencies]
arboard = { version = "=3.7.0", default-features = false, features = ["image-data"], optional = true }
png = { version = "=0.18.1", optional = true }
dioxus-icons = { version = "=0.1.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
i18n-embed = { version = "=0.16.0", default-features = false, features = ["fluent-system", "rust-embed"] }
i18n-embed-fl = "=0.10.1"
rust-embed = { version = "=8.13.0", features = ["debug-embed"] }
zeroize = "=1.9.1"
uao-rs = "=0.1.0"
encoding_rs = "=0.8.42"
url = "=2.5.8"
font-kit = { version = "=0.14.3", optional = true }
webbrowser = { version = "=1.2.4", optional = true }
rfd = { version = "=0.17.2", optional = true }
tempfile = { version = "=3.27.0", optional = true }
directories = { version = "=6.0.0", optional = true }
dioxus = { version = "=0.7.10", optional = true, default-features = false, features = ["minimal", "document", "desktop"] }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "sync", "time", "net", "macros", "io-util"] }
base64 = { version = "0.22", optional = true }
tokio-tungstenite = { version = "=0.28.0", optional = true, features = ["rustls-tls-native-roots"] }
futures-util = { version = "0.3", optional = true, features = ["sink"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = { version = "0.8", optional = true }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "stream"], optional = true }
imagesize = { version = "=0.15.0", default-features = false, features = ["jpeg", "png", "gif", "webp"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "=3.7.0", optional = true }

[[bin]]
name = "pttstella"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "replay"
path = "src/bin/replay.rs"

[dev-dependencies]
fluent-syntax = "=0.12.0"

[build-dependencies]
winresource = { version = "=0.1.31", default-features = false, optional = true }
