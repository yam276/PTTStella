[package]
name = "pttstella"
version = "0.1.0-dev.1"
edition = "2024"
rust-version = "1.97"
publish = false
default-run = "pttstella"

[features]
default = []
desktop = ["dep:dioxus", "dep:tokio", "dep:base64", "dep:tokio-tungstenite", "dep:futures-util", "dep:rustls", "dep:rustls-native-certs", "dep:webbrowser", "dep:rfd", "dep:tempfile"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uao-rs = "=0.1.0"
url = "=2.5.8"
webbrowser = { version = "=1.2.4", optional = true }
rfd = { version = "=0.17.2", optional = true }
tempfile = { version = "=3.27.0", optional = true }
dioxus = { version = "=0.7.10", optional = true, default-features = false, features = ["minimal", "document", "desktop"] }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "sync", "time", "net", "macros"] }
base64 = { version = "0.22", optional = true }
tokio-tungstenite = { version = "=0.28.0", optional = true, features = ["rustls-tls-native-roots"] }
futures-util = { version = "0.3", optional = true, features = ["sink"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = { version = "0.8", optional = true }

[[bin]]
name = "pttstella"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "replay"
path = "src/bin/replay.rs"
